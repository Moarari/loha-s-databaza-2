<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Moja Databáza</title>
    <style>
        .card { border: 1px solid #ccc; padding: 10px; margin: 10px; display: inline-block; text-align: center; }
        img { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; }
    </style>
</head>
<body>

    <h2>Pridať osobu</h2>
    <form id="addForm">
        <input type="text" id="name" placeholder="Meno" required>
        <input type="number" id="age" placeholder="Vek" required>
        <input type="text" id="image" placeholder="URL obrázka" required>
        <button type="submit">Pridať</button>
    </form>

    <hr>
    
    <label>Zoradiť podľa:</label>
    <select id="sortSelect" onchange="loadPeople()">
        <option value="default">Pôvodné</option>
        <option value="name-asc">A-Z</option>
        <option value="name-desc">Z-A</option>
        <option value="age-asc">Vek vzostupne</option>
        <option value="age-desc">Vek zostupne</option>
    </select>

    <div id="mojDivVJs">
        </div>

    <script src="script.js"></script>
</body>
</html>
